name: Track stock

on:
  schedule:
    # Hourly, at an off-peak minute (GitHub may delay scheduled runs).
    - cron: "23 * * * *"
  workflow_dispatch: # allows a manual run from the Actions tab

permissions:
  contents: write

# Shared with friday-watch.yml so the two never commit at the same time.
concurrency:
  group: track-stock
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Check the store
        run: python3 scripts/crawl.py

      - name: Commit changes
        run: |
          git add data
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "Stock update $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push
